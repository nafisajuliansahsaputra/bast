name: Build InfinityFree Package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-infinityfree-package.yml'
      - 'deploy/infinityfree/**'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'storage/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bast_build
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Install MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client

      - name: Build demo database
        shell: bash
        run: |
          set -euo pipefail

          export APP_NAME=BAST
          export APP_ENV=production
          export APP_KEY="base64:$(openssl rand -base64 32 | tr -d '\n')"
          export APP_DEBUG=false
          export APP_URL=http://localhost
          export DB_CONNECTION=mysql
          export DB_HOST=127.0.0.1
          export DB_PORT=3306
          export DB_DATABASE=bast_build
          export DB_USERNAME=root
          export DB_PASSWORD=root
          export SESSION_DRIVER=file
          export CACHE_STORE=file
          export QUEUE_CONNECTION=sync
          export FILESYSTEM_DISK=local
          export BAST_SUPER_ADMIN_EMAIL=admin@bast.local
          export BAST_SUPER_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export BAST_DEMO_MODE=true
          export BAST_DEMO_EMAIL=rina.maharani@bast.local
          export BAST_DEMO_READ_ONLY=true

          php artisan migrate:fresh --seed --force
          php artisan optimize:clear

          mkdir -p dist/artifact
          mysqldump \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password=root \
            --single-transaction \
            --skip-lock-tables \
            --default-character-set=utf8mb4 \
            bast_build > dist/artifact/bast-infinityfree.sql

      - name: Prepare InfinityFree package
        shell: bash
        run: |
          set -euo pipefail

          TOKEN="$(openssl rand -hex 12)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"

          mkdir -p dist/htdocs/app-core

          cp -a app bootstrap config database resources routes storage vendor artisan composer.json composer.lock dist/htdocs/app-core/
          mkdir -p dist/htdocs/app-core/storage/framework/cache
          mkdir -p dist/htdocs/app-core/storage/framework/sessions
          mkdir -p dist/htdocs/app-core/storage/framework/views
          mkdir -p dist/htdocs/app-core/storage/logs
          mkdir -p dist/htdocs/app-core/storage/app
          mkdir -p dist/htdocs/app-core/bootstrap/cache

          cp -a public/. dist/htdocs/
          cp deploy/infinityfree/index.php dist/htdocs/index.php
          cp deploy/infinityfree/.htaccess dist/htdocs/.htaccess
          sed "s/__SETUP_TOKEN_HASH__/$TOKEN_HASH/g" deploy/infinityfree/install.php > dist/htdocs/install.php

          rm -f dist/htdocs/hot
          rm -rf dist/htdocs/storage

          printf '%s\n' "$TOKEN" > dist/artifact/SETUP_TOKEN.txt

          cat > dist/artifact/DEPLOY_INFO.txt <<'EOF'
          BAST - InfinityFree deployment

          1. Buat hosting account dan MySQL database di InfinityFree.
          2. Buka phpMyAdmin database tersebut, lalu import bast-infinityfree.sql.
          3. Upload SEMUA isi folder htdocs/ ke folder htdocs hosting menggunakan FileZilla/FTP.
          4. Buka https://DOMAIN-KAMU/install.php.
          5. Isi Setup Token dari SETUP_TOKEN.txt, credential MySQL InfinityFree, serta email/password Super Admin yang kamu inginkan.
          6. Setelah installer sukses, HAPUS install.php dari htdocs.
          7. Jangan pernah upload SETUP_TOKEN.txt ke hosting.

          Catatan:
          - Session/cache menggunakan file dan queue menggunakan sync agar kompatibel dengan free hosting.
          - Database sudah berisi data demo dan file lampiran demo ikut berada di app-core/storage.
          EOF

      - name: Validate InfinityFree file limits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          root = Path("dist/htdocs")
          violations = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              size = path.stat().st_size
              name = path.name.lower()
              suffix = path.suffix.lower()

              if name == ".htaccess":
                  limit = 10 * 1024
              elif suffix in {".php", ".html", ".htm", ".js"}:
                  limit = 1024 * 1024
              else:
                  limit = 10 * 1024 * 1024

              if size > limit:
                  violations.append((path, size, limit))

          if violations:
              print("InfinityFree file-size limit violations:")
              for path, size, limit in violations:
                  print(f"- {path}: {size} bytes > {limit} bytes")
              sys.exit(1)

          files = [p for p in root.rglob("*") if p.is_file()]
          total = sum(p.stat().st_size for p in files)
          print(f"Validated {len(files)} files ({total / 1024 / 1024:.2f} MiB).")
          PY

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: bast-infinityfree
          path: dist/
          if-no-files-found: error
          retention-days: 14
